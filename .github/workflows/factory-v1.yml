name: Ecrin App Factory V1

on:
  workflow_dispatch:
    inputs:
      app_request:
        description: "Describe the Android app you want to build"
        required: true
        default: "Create an offline image to PDF Android app"
      package_name:
        description: "Android package name"
        required: true
        default: "com.ecrinlabs.generatedapp"
      monetization:
        description: "Monetization"
        required: true
        type: choice
        options:
          - ads
          - free
          - freemium
        default: ads

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build app plan
        run: |
          python scripts/factory_v1.py \
            --request "${{ inputs.app_request }}" \
            --package "${{ inputs.package_name }}" \
            --monetization "${{ inputs.monetization }}"

      - name: Validate outputs
        run: |
          test -s output/app-spec.json
          test -s output/BUILD_PLAN.md
          python -m json.tool output/app-spec.json >/dev/null
          echo "Factory V1 output validated."

      - name: Upload Factory Plan
        uses: actions/upload-artifact@v4
        with:
          name: ecrin-app-factory-v1-plan
          path: |
            output/app-spec.json
            output/BUILD_PLAN.md
          retention-days: 7
