name: Ecrin App Factory V2
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name"
        required: true
        default: "ImagePDF"
      package_name:
        description: "Android package name"
        required: true
        default: "com.ecrinlabs.imagepdf"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Android project
        run: python3 scripts/factory_v2.py --name "${{ inputs.app_name }}" --package "${{ inputs.package_name }}"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APK
        working-directory: generated-app
        run: gradle --no-daemon assembleDebug
      - name: Validate APK
        run: test -s generated-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ecrin-app-factory-v2-apk
          path: generated-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
