name: Ecrin App Factory V3

on:
  workflow_dispatch:
    inputs:
      app_request:
        description: "Describe the Android app you want to build"
        required: true
        default: "Create an offline image to PDF Android app"
      app_name:
        description: "App name"
        required: true
        default: "ImagePDF"
      package_name:
        description: "Android package name"
        required: true
        default: "com.ecrinlabs.imagepdf"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate real Android app
        run: |
          python3 scripts/factory_v3.py             --request "${{ inputs.app_request }}"             --name "${{ inputs.app_name }}"             --package "${{ inputs.package_name }}"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: generated-app
        run: gradle --no-daemon assembleDebug

      - name: Validate APK
        run: test -s generated-app/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ecrin-app-factory-v3-apk
          path: generated-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
