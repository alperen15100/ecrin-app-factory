name: Ecrin App Factory V4 Agentic FIX3

on:
  workflow_dispatch:
    inputs:
      app_request:
        description: "Describe the Android app you want"
        required: true
        default: "Build a premium offline Android app that scans receipts with OCR and exports results to CSV."
      app_name:
        description: "App name"
        required: true
        default: "EcrinApp"
      package_name:
        description: "Android package name"
        required: true
        default: "com.ecrinlabs.generatedapp"

permissions:
  contents: read

jobs:
  agentic-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout factory
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare private AAS runtime
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE_ROOT="$HOME/.ecrin-aas"
          rm -rf "$PRIVATE_ROOT"
          install -d -m 700 "$PRIVATE_ROOT"
          install -d -m 700 "$PRIVATE_ROOT/cache"
          install -d -m 700 "$PRIVATE_ROOT/codex-home"
          mkdir -p factory-output

          # IMPORTANT: do NOT pre-create config.toml.
          # If it already exists, AAS requires a backup directory before applying.
          CONFIG_PATH="$PRIVATE_ROOT/codex-home/config.toml"
          rm -f "$CONFIG_PATH"

          echo "AAS_CACHE=$PRIVATE_ROOT/cache" >> "$GITHUB_ENV"
          echo "CODEX_HOME_DIR=$PRIVATE_ROOT/codex-home" >> "$GITHUB_ENV"
          echo "CODEX_CONFIG=$CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Configure AAS Core for Codex
        shell: bash
        run: |
          set -euo pipefail

          npm exec --yes --ignore-scripts --package=agentic-awesome-skills@16.4.0 -- \
            aas mcp configure \
            --host codex \
            --scope user \
            --config "$CODEX_CONFIG" \
            --cache-root "$AAS_CACHE" \
            > "$HOME/.ecrin-aas/aas-preview.json"

          python3 scripts/approve_aas.py \
            "$HOME/.ecrin-aas/aas-preview.json" \
            "$HOME/.ecrin-aas/aas-approve.txt"

          APPROVAL_DIGEST="$(cat "$HOME/.ecrin-aas/aas-approve.txt")"

          npm exec --yes --ignore-scripts --package=agentic-awesome-skills@16.4.0 -- \
            aas mcp configure \
            --host codex \
            --scope user \
            --config "$CODEX_CONFIG" \
            --cache-root "$AAS_CACHE" \
            --approve "$APPROVAL_DIGEST"

          test -s "$CODEX_CONFIG"
          chmod 600 "$CODEX_CONFIG"
          echo "AAS Core configured successfully."

      - name: Write agent brief
        shell: bash
        env:
          APP_REQUEST: ${{ inputs.app_request }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: python3 scripts/write_agent_brief.py

      - name: Run Codex + AAS
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: ${{ env.CODEX_HOME_DIR }}
          permission-profile: ":workspace"
          prompt-file: factory-output/AGENT_BRIEF.md
          output-file: factory-output/CODEX_FINAL.md
          effort: high

      - name: Validate generated project
        shell: bash
        run: |
          set -euo pipefail
          test -f aas-stack.json || { echo "aas-stack.json was not produced"; exit 1; }
          test -f settings.gradle.kts -o -f settings.gradle || { echo "Android project root not found"; exit 1; }
          test -d app || { echo "app module not found"; exit 1; }

      - name: Build Android APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon assembleDebug bundleRelease
          elif command -v gradle >/dev/null 2>&1; then
            gradle --no-daemon assembleDebug bundleRelease
          else
            echo "No Gradle wrapper or Gradle command found"
            exit 1
          fi

      - name: Collect outputs
        if: always()
        shell: bash
        run: |
          mkdir -p factory-output/artifacts
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} factory-output/artifacts/ \; 2>/dev/null || true
          cp aas-stack.json factory-output/ 2>/dev/null || true
          cp aas-selection-evidence.json factory-output/ 2>/dev/null || true
          cp aas-plan.json factory-output/ 2>/dev/null || true
          printf 'Workflow reached output collection.\n' > factory-output/RUN_STATUS.txt

      - name: Upload factory result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecrin-app-factory-v4-result
          path: factory-output/
          if-no-files-found: warn
