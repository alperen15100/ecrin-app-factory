name: Validate Ecrin App Factory

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "factory/**"
      - "scripts/**"
      - "AGENTS.md"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate factory stack
        run: python scripts/validate_stack.py
